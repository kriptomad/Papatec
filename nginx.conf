events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    server_tokens off;

    # Force UTF-8 para todas as respostas de texto (HTML, JSON, JS, CSS, etc.)
    charset utf-8;
    source_charset utf-8;

    # So envia upgrade quando o cliente realmente pediu. A config anterior
    # forçava `Connection 'upgrade'` em TODO request /api/, o que desliga o
    # keepalive do upstream e confunde o handling de protocolo (risco com SSE).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # -------------------------------------------------------------------------
    # gzip: o hop duplo (edge -> browser e web -> browser) mandava ~1.2 MB de
    # bundle React/MUI sem comprimir em toda visita.
    # -------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json
               application/javascript application/x-javascript
               application/xml+rss application/rss+xml
               image/svg+xml application/wasm;

    # Os upstreams abaixo foram trocados por variáveis + `resolver` do DNS
    # embutido do Docker: blocos `upstream` são resolvidos UMA vez, na subida
    # do nginx, e o boot falhava com "host not found in upstream" caso a API/
    # web ainda não estivessem registradas (crash loop do proxy).

    server {
        listen 80;
        server_name localhost;

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        # `http2` como diretiva separada: `listen ... http2` esta obsoleto
        # desde nginx 1.25.1 (gera warning em 1.27).
        listen 443 ssl;
        http2 on;
        server_name localhost;

        resolver 127.0.0.11 valid=30s ipv6=off;

        ssl_certificate /etc/nginx/certs/localhost.crt;
        ssl_certificate_key /etc/nginx/certs/localhost.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:!aNULL:!MD5:!RC4;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Segurança baseline + HSTS (antes nao existia nenhuma)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # Frontend
        location / {
            set $web_upstream http://web:80;
            proxy_pass $web_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Assets estáticos - desabilita gzip para preservar charset UTF-8
        location /assets/ {
            set $web_upstream http://web:80;
            proxy_pass $web_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            gzip off;
        }

        # -------------------------------------------------------------------------
        # SSE (EventSource): GET /api/os/:id/realtime
        #
        # ANTES nao havia location especifica: o request caia em /api/ com
        # proxy_buffering PADRAO (on) e proxy_read_timeout padrao de 60s => o
        # nginx bufferizava os eventos e derrubava a conexao. O heartbeat do
        # backend (30s) mal sobrevivia.
        # -------------------------------------------------------------------------
        location ~ ^/api/.+/realtime$ {
            set $api_upstream http://api:3001;
            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;
            proxy_cache off;
            proxy_request_buffering off;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
            proxy_connect_timeout 5s;
            send_timeout 1h;
            chunked_transfer_encoding on;
            client_max_body_size 20M;

            # O EventSource envia o JWT na query string (?token=...). Nao
            # registramos o access log deste endpoint para o token nao ficar
            # persistido em disco no log do proxy.
            access_log off;
        }

        # API Backend
        location /api/ {
            set $api_upstream http://api:3001;
            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            client_max_body_size 20M;
            proxy_connect_timeout 5s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # Uploads estáticos
        location /uploads/ {
            set $api_upstream http://api:3001;
            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 120s;
            # (proxy_cache_valid sem zona proxy_cache definida era no-op)
            add_header Cache-Control "public, max-age=86400" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # API fora do ar -> aviso claro em vez do 500 bruto do nginx.
        # (a location nomeada precisa estar DENTRO do bloco server)
        error_page 502 503 504 =503 @backend_down;

        location @backend_down {
            default_type application/json;
            add_header Cache-Control "no-store" always;
            return 503 '{"success":false,"data":null,"error":{"code":"SERVICE_UNAVAILABLE","message":"Serviço temporariamente indisponível. Tente novamente."}}';
        }
    }
}
