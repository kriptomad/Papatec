# ---------------------------------------------------------------------------
# map precisa ficar em contexto http - este arquivo e incluido em http via
# /etc/nginx/conf.d/*.conf, entao a diretiva e aceita aqui.
# Usa upgrade somente quando o cliente realmente pediu (evita mandar
# "Connection: upgrade" em TODO request normal, o que quebra keepalive).
# ---------------------------------------------------------------------------
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Garante que o charset filter seja aplicado a JS/CSS/JSON
charset_types text/css application/javascript application/json text/xml application/xml;

server {
    listen 80;
    server_name _;
    server_tokens off;

    # DNS embutido do Docker. Com `resolver` + proxy_pass em variavel, o
    # nginx resolve "api" a cada requisicao em vez de resolver UMA vez na
    # subida: se a API subir depois (ou reiniciar), o nginx nao aborta com
    # "host not found in upstream" e o container entra em crash loop.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Force UTF-8 para todas as respostas de texto (HTML, JSON, JS, CSS)
    charset utf-8;
    source_charset utf-8;

    root /usr/share/nginx/html;
    index index.html;

    # ------------------------------- gzip (antes nao existia)
    # O bundle React+MUI tem ~1.2 MB; sem gzip ia inteiro a cada visita.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json
               application/javascript application/x-javascript
               application/xml+rss application/rss+xml
               image/svg+xml application/wasm;
    # ATENCAO: text/event-stream NUNCA entra em gzip_types (bufferizaria o SSE)

    # ------------------------------- headers de seguranca
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---------------------------------------------------------------------------
    # CRITICO - index.html NUNCA pode ser cacheado.
    #
    # Sem esta regra o browser usava o cache heuristico (so Last-Modified/ETag)
    # e reusava um index.html ANTIGO apos um deploy. Esse index.html referenciava
    # assets/index-<HASH-ANTIGO>.js, que ja nao existia na imagem nova => 404 =>
    # TELA EM BRANCO permanente ate Ctrl+F5. Era a causa raiz #2 do problema da
    # pagina vazia (a causa #1 era o ErrorBoundary sem `return children`).
    #
    # try_files do location / faz redirect interno para /index.html, que cai
    # aqui por ser location exato.
    # ---------------------------------------------------------------------------
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    # SPA (React Router) - qualquer rota interna cai no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------------------------------------------------------------------------
    # SSE (EventSource): GET /api/os/:id/realtime
    #
    # Regex ganha do prefixo /api/. Sem isto o proxy_buffering PADRAO do nginx
    # segura os eventos em buffer e a conexao de tempo real engasga/cai.
    # ---------------------------------------------------------------------------
    location ~ ^/api/.+/realtime$ {
        set $api_upstream http://api:3001;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;          # obrigatorio para SSE
        proxy_cache off;
        proxy_request_buffering off;
        proxy_read_timeout 1h;        # EventSource nao pode expirar aos 60s
        proxy_send_timeout 1h;
        proxy_connect_timeout 5s;
        send_timeout 1h;
        chunked_transfer_encoding on;
        client_max_body_size 20M;
    }

    # API - encaminha para o container da API (rotas montadas em /api)
    location /api/ {
        set $api_upstream http://api:3001;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20M;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;      # downloads de backup / relatorios grandes
        proxy_send_timeout 300s;
    }

    # Fotos/anexos servidos pelo backend (UUIDs imutaveis -> cache no browser)
    location /uploads/ {
        set $api_upstream http://api:3001;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        # (proxy_cache_valid sem proxy_cache definido era um no-op)
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Assets versionados do Vite: UMA unica tag Cache-Control.
    # Antes havia `expires 30d` + `add_header Cache-Control`, que geravam DUAS
    # cabecalhos Cache-Control na mesma resposta.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header Vary "Accept-Encoding" always;
        charset utf-8;
        source_charset utf-8;
        # Desabilita gzip para permitir que o charset filter funcione corretamente
        gzip off;
        access_log off;
    }

    # demais arquivos de public/ (favicon, logo)
    location = /favicon.png      { try_files $uri =404; add_header Cache-Control "public, max-age=86400" always; }
    location = /logo-papatec.png { try_files $uri =404; add_header Cache-Control "public, max-age=86400" always; }

    location = /healthz { access_log off; return 200 "ok\n"; add_header Content-Type text/plain; }

    # API fora do ar -> SPA (evita a pagina 500 branca do nginx)
    error_page 502 503 504 /index.html;
}